<style>
/* Layout: app shell. Deep green brand bar on top, side nav on wide screens, bottom tab bar on phones. */
:root{
  --brand:#04211A; --brand-2:#0B3A2E; --gold:#C9962E; --gold-ink:#7A5A0E;
  --bg:#F6F3EA; --surface:#FFFDF8; --surface-2:#EFEADB; --line:#E0D6BC;
  --fg:#0D1411; --muted:#4E5A54; --on-brand:#F7F2E6;
  --good:#1F7A4D; --good-bg:#E2F2E9; --warn:#9A6A00; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE4E2;
  --f-display:'Fraunces',Georgia,serif; --f-body:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1612; --surface:#10211B; --surface-2:#16302A; --line:#26443A;
  --fg:#EDE8DA; --muted:#A9B7AF; --gold-ink:#E2B54E;
  --good:#6FD39E; --good-bg:#123426; --warn:#F0C25A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1612; --surface:#10211B; --surface-2:#16302A; --line:#26443A;
  --fg:#EDE8DA; --muted:#A9B7AF; --gold-ink:#E2B54E;
  --good:#6FD39E; --good-bg:#123426; --warn:#F0C25A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:34px;width:auto}
.top .name{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.2px}
.demo{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--gold);color:#F0D28A;border-radius:999px;padding:3px 9px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.who select{background:var(--brand-2);border:1px solid #2E5A4C;color:var(--on-brand);border-radius:8px;padding:6px 8px;max-width:58vw}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - 56px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--muted)}
nav button svg{width:20px;height:20px;flex:none}
nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
nav button .n{margin-left:auto;background:var(--gold);color:var(--brand);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
main{min-width:0;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-ink)}
.agent{display:flex;gap:12px;align-items:flex-start;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:14px 16px}
.agent .dot{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none;color:var(--brand)}
.agent b{color:#F0D28A}
.agent p{margin:2px 0 0;font-size:14px;color:#D5DED9}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.co{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff}
.co h3{font-family:var(--f-body);font-size:16px;font-weight:700}
.co small{color:var(--muted);font-size:13px}
.score{margin-left:auto;text-align:right;flex:none}
.score b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--good)}
.score span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.why{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.why .eyebrow{display:block;margin-bottom:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--good-bg);color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--fg)}
.btn.pri{background:var(--brand);color:var(--on-brand)}
:root:not([data-theme="light"]) .btn.pri{background:var(--gold);color:var(--brand)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.pri{background:var(--brand);color:var(--on-brand)}}
:root[data-theme="light"] .btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--gold);color:var(--brand)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
/* messages */
.chat{display:grid;grid-template-columns:280px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px}
.threads{border-right:1px solid var(--line);overflow:auto}
.thread{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.thread[aria-current="true"]{background:var(--surface-2)}
.thread .t{min-width:0}
.thread .t b{display:block;font-size:14px}
.thread .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conv .ch .row{margin-left:auto}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:52vh}
.m{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px}
.m.them{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--brand);color:var(--on-brand);align-self:flex-end;border-bottom-right-radius:4px}
.m.ai{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:13px;max-width:92%;text-align:center}
.m time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.back{display:none}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block}
.li .t span{color:var(--muted);font-size:13.5px}
.when{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;text-align:center;min-width:76px}
.when b{display:block;font-size:18px;font-family:var(--f-display)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
/* deals */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:4px;background:var(--surface-2)}
.steps span.on{background:var(--gold)}
.steplab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.tbl{overflow-x:auto}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist div{display:flex;gap:8px}
.hist time{color:var(--muted);font-family:var(--f-mono);font-size:12px;flex:none;width:58px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--gold)}
.bar em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--muted)}
/* forms + modal */
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 32px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(4,33,26,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;text-align:center;font-size:13.5px;font-weight:600}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
nav.tabs{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;position:relative}
  nav.tabs button .n{position:absolute;top:2px;right:18%;margin:0}
  .chat{grid-template-columns:1fr}
  .chat.open .threads{display:none}
  .chat:not(.open) .conv{display:none}
  .back{display:inline-block}
  .form{grid-template-columns:1fr}
  .bar{grid-template-columns:96px 1fr 30px}
  .head h1{font-size:24px}
  .who span{display:none}
  .top{gap:8px 10px}
  .top img{height:28px}
  .top .name{font-size:16px}
  .demo{font-size:10px;padding:2px 7px}
}

.acct{display:flex;align-items:center;gap:8px;font-size:13px;margin-left:auto;min-width:0}
.acct span{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.btn.small{padding:6px 10px;font-size:13px}
.top .btn.ghost{color:var(--on-brand);border-color:#2E5A4C}
body.nonav .shell{grid-template-columns:1fr}
body.nonav nav.side,body.nonav nav.tabs{display:none!important}
.authbox{max-width:440px;margin:24px auto;gap:12px}
.authbox h1{font-size:26px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:0;min-height:0}
.err:empty{display:none}
.link{background:none;border:0;padding:0;color:var(--gold-ink);font-weight:700;text-decoration:underline;cursor:pointer}
.banner{border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.h3{font-family:var(--f-body);font-size:16px;font-weight:700}
.total{font-size:16px!important;color:var(--fg)!important}
.additem{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:8px}
.additem input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-width:0}
.compose input:disabled{opacity:.6}
@media (max-width:820px){.additem{grid-template-columns:1fr 1fr}.additem input:first-child{grid-column:1/-1}.acct span{display:none}}
</style></head>

const words=s=>new Set(String(s||'').toLowerCase().split(/[^a-z0-9&]+/).filter(w=>w.length>2&&!STOP.has(w)));
function quickScore(c){
 const m=S.me;if(!m)return 0;
 const mySells=words(m.sells),myWants=words(m.wants+' '+m.sells),myMk=words(m.markets);
 const theirSells=words(c.sells),theirWants=words(c.wants),theirAll=words([c.sells,c.wants,c.role,c.city,c.country].join(' '));
 let hit=0;myWants.forEach(w=>{if(theirSells.has(w))hit++});mySells.forEach(w=>{if(theirWants.has(w))hit++});
 let mk=0;myMk.forEach(w=>{if(theirAll.has(w))mk++});
 const sideFit=(BUY_SIDE.includes(m.role)!==BUY_SIDE.includes(c.role))?12:0;
 return Math.min(97,Math.round(35+hit*9+mk*6+sideFit));
}
function suggestions(){
 if(!S.me)return [];
 const fromAgent=new Map(S.matches.filter(x=>x.status!=='passed').map(x=>[x.match_company,x]));
 const passed=new Set(S.matches.filter(x=>x.status==='passed').map(x=>x.match_company));
 return S.cos.filter(c=>c.id!==S.me.id&&c.status==='approved'&&!passed.has(c.id)).map(c=>{
  const a=fromAgent.get(c.id);
  return {c,score:a?a.score:quickScore(c),why:a?a.reason:null,agent:!!a};
 }).sort((x,y)=>(y.agent-x.agent)||(y.score-x.score));
}

async function loadAll(){
 const uid=S.user.id;
 const [me,ad]=await Promise.all([
  sb.from('companies').select('*').eq('owner',uid).maybeSingle(),
  sb.from('admins').select('user_id').eq('user_id',uid).maybeSingle()]);
 S.me=me.data||null;S.admin=!!ad.data;
 const [cos,mt,cv,mg,dl]=await Promise.all([
  sb.from('companies').select('*').order('created_at',{ascending:false}),
  S.me?sb.from('matches').select('*').eq('for_company',S.me.id):Promise.resolve({data:[]}),
  sb.from('conversations').select('*'),
  sb.from('meetings').select('*').order('starts_at'),
  sb.from('deals').select('*').order('created_at',{ascending:false})]);
 S.cos=cos.data||[];S.matches=mt.data||[];S.convs=cv.data||[];S.meetings=mg.data||[];S.deals=dl.data||[];
 if(S.convs.length){const r=await sb.from('messages').select('conversation_id,body,created_at,sender_company,kind').in('conversation_id',S.convs.map(c=>c.id)).order('created_at',{ascending:false}).limit(300);
  S.last={};(r.data||[]).forEach(m=>{if(!S.last[m.conversation_id])S.last[m.conversation_id]=m});}
 if(S.deals.length){const ids=S.deals.map(d=>d.id);
  const [it,ev]=await Promise.all([sb.from('deal_items').select('*').in('deal_id',ids),sb.from('deal_events').select('*').in('deal_id',ids).order('created_at')]);
  S.items={};S.events={};(it.data||[]).forEach(i=>(S.items[i.deal_id]=S.items[i.deal_id]||[]).push(i));(ev.data||[]).forEach(e=>(S.events[e.deal_id]=S.events[e.deal_id]||[]).push(e));}
 if(S.admin){const u=await sb.rpc('admin_users');S.users=u.error?null:(u.data||[])}
 S.loading=false;
}

async function openChat(otherId){
 if(!approved()){toast('Messaging opens after SAIS vets your company');return}
 const [a,b]=[S.me.id,otherId].sort();
 let cv=S.convs.find(x=>x.company_a===a&&x.company_b===b);
 if(!cv){const r=await sb.from('conversations').insert({company_a:a,company_b:b}).select().single();
  if(r.error){const again=await sb.from('conversations').select('*').eq('company_a',a).eq('company_b',b).maybeSingle();if(!again.data)return fail(r.error,'Could not start the chat');cv=again.data}else cv=r.data;
  S.convs.push(cv);}
 const m=S.matches.find(x=>x.match_company===otherId);if(m&&m.status==='new'){m.status='contacted';sb.from('matches').update({status:'contacted'}).eq('id',m.id)}
 S.open=cv.id;await loadMsgs(cv.id);go('messages');
}

 if(!approved()){toast('Meetings open after SAIS vets your company');return}
 const c=co(otherId);

 const local=new Date(t.getTime()-t.getTimezoneOffset()*60000).toISOString().slice(0,16);
 $('#dlgBody').innerHTML=`<div class="co">${av(c)}<div><h3 class="h3">Book a meeting</h3><small class="muted">with ${esc(c.name)}</small></div></div>
  <form id="bookForm" class="stack" data-to="${otherId}">
  <label class="f">Meeting type<select id="mType"><option>Video call</option><option>In person</option><option>VIP meeting at a trade fair</option><option>Phone call</option></select></label>
  <label class="f">Day and time (your time zone)<input id="mWhen" type="datetime-local" value="${local}" required></label>
  <p class="muted small">${esc(c.name)} confirms or declines from their Meetings page.</p>
  <div class="row"><button class="btn pri">Send invite</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`;
 $('#dlg').showModal();
}
async function openDeal(otherId){
 if(!approved()){toast('Deal rooms open after SAIS vets your company');return}
 const other=co(otherId);const iBuy=BUY_SIDE.includes(S.me.role)&&!BUY_SIDE.includes(other.role);
 $('#dlgBody').innerHTML=`<h3 class="h3">Open a deal room</h3><p class="muted" style="margin:0">with ${esc(other.name)}</p>
  <form id="dealForm" class="stack" data-to="${otherId}">
  <label class="f">Deal name<input id="dTitle" placeholder="For example: 120 hotel rooms, furniture" required></label>
  <label class="f">In this deal I am<select id="dSide"><option value="sell" ${iBuy?'':'selected'}>Selling</option><option value="buy" ${iBuy?'selected':''}>Buying</option></select></label>
  <div class="row"><button class="btn pri">Open deal room</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`;
 $('#dlg').showModal();
}
async function logEvent(dealId,note){const r=await sb.from('deal_events').insert({deal_id:dealId,actor_company:S.me.id,note}).select().single();if(r.data)(S.events[dealId]=S.events[dealId]||[]).push(r.data)}

document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const ds=b.dataset;
 try{
 if(ds.go)go(ds.go);
 else if(ds.auth){S.authMode=ds.auth;render()}
 else if('reset' in ds){const em=$('#a_email').value.trim();if(!em){$('#authErr').textContent='Type your email above first.';return}
  const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$('#authErr').textContent=r.error?r.error.message:'Check your email for a reset link.'}
 else if('logout' in ds){await sb.auth.signOut()}
 else if('close' in ds){$('#dlg').close()}
 else if(ds.filter){S.filter=ds.filter;render()}
 else if(ds.pass){const id=ds.pass;const m=S.matches.find(x=>x.match_company===id);
  if(m){m.status='passed';await sb.from('matches').update({status:'passed'}).eq('id',m.id)}else{S.matches.push({match_company:id,status:'passed',local:true})}
  toast('Hidden from your matches');render()}
 else if(ds.msg)await openChat(ds.msg);
 else if(ds.thread){S.open=ds.thread;await loadMsgs(ds.thread);render()}
 else if('back' in ds){S.open=null;render()}
 else if(ds.book)openBook(ds.book);
 else if(ds.newdeal)openDeal(ds.newdeal);
 else if(ds.mconfirm||ds.mdecline){const id=ds.mconfirm||ds.mdecline,st=ds.mconfirm?'confirmed':'declined';const r=await sb.from('meetings').update({status:st}).eq('id',id);if(r.error)return fail(r.error);S.meetings.find(m=>m.id===id).status=st;toast(st==='confirmed'?'Meeting confirmed':'Meeting declined');render()}
 else if(ds.accept||ds.delivered){const id=ds.accept||ds.delivered,stage=ds.accept?'Accepted':'Delivered';const r=await sb.from('deals').update({stage}).eq('id',id);if(r.error)return fail(r.error);
  S.deals.find(d=>d.id===id).stage=stage;await logEvent(id,`${S.me.name} marked the deal as ${stage.toLowerCase()}`);toast('Deal '+stage.toLowerCase());render()}
 else if(ds.discount){const d=S.deals.find(x=>x.id===ds.discount);
  $('#dlgBody').innerHTML=`<h3 class="h3">Offer a discount</h3><p class="muted" style="margin:0">${esc(d.title)}</p><form id="discForm" class="stack" data-deal="${d.id}"><label class="f">Discount on the whole order (%)<input id="disc" type="number" min="0" max="50" step="0.5" value="${Number(d.discount)||5}" required></label><div class="row"><button class="btn pri">Send new offer</button><button type="button" class="btn ghost" data-close>Cancel</button></div></form>`;$('#dlg').showModal()}
 else if(ds.rmitem){const r=await sb.from('deal_items').delete().eq('id',ds.rmitem);if(r.error)return fail(r.error);S.items[ds.deal]=(S.items[ds.deal]||[]).filter(i=>i.id!==ds.rmitem);render()}
 else if(ds.approve||ds.decline){const id=ds.approve||ds.decline,st=ds.approve?'approved':'declined';const r=await sb.from('companies').update({status:st}).eq('id',id).select().single();if(r.error)return fail(r.error);
  Object.assign(S.cos.find(c=>c.id===id),r.data);if(S.me&&S.me.id===id)S.me=r.data;toast(r.data.name+(st==='approved'?' approved':' declined'));render()}
 }catch(err){fail(err)}
});

document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target;
 try{
 if(f.id==='newPw'){const r=await sb.auth.updateUser({password:$('#np').value});if(r.error){$('#npErr').textContent=r.error.message;return}S.recovery=false;toast('Password saved');render();return}
 if(f.id==='authForm'){const email=$('#a_email').value.trim(),pw=$('#a_pw').value;const err=$('#authErr');err.textContent='';
  const btn=f.querySelector('button');btn.disabled=true;
  const r=f.dataset.mode==='signup'?await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false;
  if(r.error){err.textContent=/invalid login/i.test(r.error.message)?'Wrong email or password.':r.error.message;return}
  if(f.dataset.mode==='signup')notify({event:'New account created, company form not filled yet',email});
  if(f.dataset.mode==='signup'&&!r.data.session){err.textContent='Check your email and tap the link to confirm your account, then log in here.';}
 }
 else if(f.id==='prof'){const keys=['name','role','city','country','sells','wants','markets','deal_size','website','whatsapp'];const v={};keys.forEach(k=>v[k]=$('#p_'+k).value.trim());
  const err=$('#profErr');if(!/[.@\/]/.test(v.website)){err.textContent='Please add a website or social media link. We use it to vet your company.';return}
  let r;if(S.me)r=await sb.from('companies').update(v).eq('id',S.me.id).select().single();else r=await sb.from('companies').insert({...v,owner:S.user.id}).select().single();
  if(r.error){err.textContent='Could not save: '+r.error.message;return}
  const first=!S.me;if(first)notify({event:'Company submitted for vetting',email:S.user.email,company:v.name,role:v.role,city:v.city,country:v.country,whatsapp:v.whatsapp,website:v.website,sells:v.sells,wants:v.wants,markets:v.markets});S.me=r.data;const i=S.cos.findIndex(c=>c.id===r.data.id);if(i>=0)S.cos[i]=r.data;else S.cos.unshift(r.data);
  toast(first?'Submitted. SAIS will vet your company shortly.':'Saved');go('matches')}
 else if(f.id==='compose'){const i=$('#msgIn'),body=i.value.trim();if(!body)return;i.value='';
  const r=await sb.from('messages').insert({conversation_id:S.open,sender_company:S.me.id,body}).select().single();if(r.error){i.value=body;return fail(r.error,'Message not sent')}
  addMsg(r.data)}
 else if(f.id==='bookForm'){const when=new Date($('#mWhen').value);if(isNaN(when)||when<new Date()){toast('Pick a future day and time');return}
  const r=await sb.from('meetings').insert({from_company:S.me.id,to_company:f.dataset.to,starts_at:when.toISOString(),meeting_type:$('#mType').value}).select().single();if(r.error)return fail(r.error,'Invite not sent');
  S.meetings.push(r.data);S.meetings.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));$('#dlg').close();toast('Invite sent to '+co(f.dataset.to).name);go('meetings')}
 else if(f.id==='dealForm'){const other=f.dataset.to,sell=$('#dSide').value==='sell';
  const r=await sb.from('deals').insert({title:$('#dTitle').value.trim(),seller_company:sell?S.me.id:other,buyer_company:sell?other:S.me.id}).select().single();if(r.error)return fail(r.error,'Could not open the deal room');
  S.deals.unshift(r.data);S.items[r.data.id]=[];S.events[r.data.id]=[];await logEvent(r.data.id,`${S.me.name} opened the deal room`);$('#dlg').close();go('deals')}
 else if(f.id==='discForm'){const id=f.dataset.deal,v=Math.max(0,Math.min(50,Number($('#disc').value)||0));const d=S.deals.find(x=>x.id===id);
  const stage=d.stage==='Proposed'?'Negotiating':d.stage;const r=await sb.from('deals').update({discount:v,stage}).eq('id',id);if(r.error)return fail(r.error);
  d.discount=v;d.stage=stage;await logEvent(id,`${S.me.name} offered ${v}% off. New total ${money(dealTotals(d).total)}`);$('#dlg').close();toast('New offer sent');render()}
 else if(f.dataset.additem){const id=f.dataset.additem;const row={deal_id:id,name:f.n.value.trim(),qty:Number(f.q.value),unit_price:Number(f.p.value)};
  const r=await sb.from('deal_items').insert(row).select().single();if(r.error)return fail(r.error,'Item not added');
  (S.items[id]=S.items[id]||[]).push(r.data);const d=S.deals.find(x=>x.id===id);if(d.stage==='Proposed'&&S.items[id].length>1){d.stage='Negotiating';await sb.from('deals').update({stage:'Negotiating'}).eq('id',id)}
  await logEvent(id,`${S.me.name} added ${row.qty} x ${row.name} at USD ${row.unit_price.toLocaleString('en-US')}`);render()}
 }catch(err){fail(err)}
});

function addMsg(m){
 if(!S.msgs[m.conversation_id])S.msgs[m.conversation_id]=[];
 if(S.msgs[m.conversation_id].some(x=>x.id===m.id))return;
 S.msgs[m.conversation_id].push(m);S.last[m.conversation_id]=m;
 if(S.view==='messages')render();
}
let channel=null;
function subscribe(){
 if(channel)sb.removeChannel(channel);
 channel=sb.channel('sais-msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{
  const m=p.new;if(!S.convs.some(c=>c.id===m.conversation_id)){const r=await sb.from('conversations').select('*').eq('id',m.conversation_id).maybeSingle();if(r.data)S.convs.push(r.data);else return}
  addMsg(m);if(m.sender_company!==(S.me&&S.me.id)&&!(S.view==='messages'&&S.open===m.conversation_id))toast('New message from '+co(m.sender_company).name);
 }).subscribe();
}

let booted=false;
sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>handleAuth(ev,session),0)});
async function handleAuth(ev,session){
 if(ev==='PASSWORD_RECOVERY'){S.recovery=true;S.user=session.user;S.loading=false;render();return}
 const uid=session&&session.user&&session.user.id;
 if(booted&&uid===(S.user&&S.user.id)&&ev!=='SIGNED_OUT')return;
 booted=true;S.user=session?session.user:null;S.loading=true;render();
 if(S.user){try{await loadAll();subscribe()}catch(e){S.loading=false;fail(e,'Could not load your data')}}
 else{S.me=null;S.loading=false;if(channel){sb.removeChannel(channel);channel=null}}
 const h=(location.hash||'').slice(1);if(['matches','messages','meetings','deals','profile','admin'].includes(h))S.view=h;
 render();
}
setTimeout(()=>{if(S.loading){$('#view').innerHTML='<div class="card empty">This is taking longer than usual. <button class="link" onclick="location.reload()">Tap to reload</button></div>'}},15000);
})();

</script>
</body>
</html>
