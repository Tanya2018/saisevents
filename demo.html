<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/sais-events-icon.png">
<title>SAIS MatchMarket: example walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Deep green brand bar on top, side nav on wide screens, bottom tab bar on phones. */
:root{
  --brand:#04211A; --brand-2:#0B3A2E; --gold:#C9962E; --gold-ink:#7A5A0E;
  --bg:#F6F3EA; --surface:#FFFDF8; --surface-2:#EFEADB; --line:#E0D6BC;
  --fg:#0D1411; --muted:#4E5A54; --pri-bg:#04211A; --pri-fg:#F7F2E6; --on-brand:#F7F2E6;
  --good:#1F7A4D; --good-bg:#E2F2E9; --warn:#9A6A00; --warn-bg:#FBF0D6; --bad:#B3261E; --bad-bg:#FBE4E2;
  --f-display:'Fraunces',Georgia,serif; --f-body:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1612; --surface:#10211B; --surface-2:#16302A; --line:#26443A;
  --fg:#EDE8DA; --muted:#A9B7AF; --gold-ink:#E2B54E; --pri-bg:#C9962E; --pri-fg:#04211A;
  --good:#6FD39E; --good-bg:#123426; --warn:#F0C25A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1612; --surface:#10211B; --surface-2:#16302A; --line:#26443A;
  --fg:#EDE8DA; --muted:#A9B7AF; --gold-ink:#E2B54E; --pri-bg:#C9962E; --pri-fg:#04211A;
  --good:#6FD39E; --good-bg:#123426; --warn:#F0C25A; --warn-bg:#33290F; --bad:#FF8A80; --bad-bg:#3A1714; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:34px;width:auto}
.top .name{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.2px}
.demo{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--gold);color:#F0D28A;border-radius:999px;padding:3px 9px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.who select{background:var(--brand-2);border:1px solid #2E5A4C;color:var(--on-brand);border-radius:8px;padding:6px 8px;max-width:58vw}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - 56px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--muted)}
nav button svg{width:20px;height:20px;flex:none}
nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
nav button .n{margin-left:auto;background:var(--gold);color:var(--brand);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
main{min-width:0;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-ink)}
.agent{display:flex;gap:12px;align-items:flex-start;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:14px 16px}
.agent .dot{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none;color:var(--brand)}
.agent b{color:#F0D28A}
.agent p{margin:2px 0 0;font-size:14px;color:#D5DED9}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.co{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff}
.co h3{font-family:var(--f-body);font-size:16px;font-weight:700}
.co small{color:var(--muted);font-size:13px}
.score{margin-left:auto;text-align:right;flex:none}
.score b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--good)}
.score span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.why{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.why .eyebrow{display:block;margin-bottom:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.role{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--good-bg);color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--fg)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg)}
.btn.gold{background:var(--gold);color:var(--brand)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
/* messages */
.chat{display:grid;grid-template-columns:280px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:480px}
.threads{border-right:1px solid var(--line);overflow:auto}
.thread{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.thread[aria-current="true"]{background:var(--surface-2)}
.thread .t{min-width:0}
.thread .t b{display:block;font-size:14px}
.thread .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:flex;flex-direction:column;min-width:0}
.conv .ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conv .ch .row{margin-left:auto}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:52vh}
.m{max-width:78%;padding:9px 12px;border-radius:12px;font-size:14px}
.m.them{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--pri-bg);color:var(--pri-fg);align-self:flex-end;border-bottom-right-radius:4px}
.m.ai{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:13px;max-width:92%;text-align:center}
.m time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.back{display:none}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.li{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block}
.li .t span{color:var(--muted);font-size:13.5px}
.when{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;text-align:center;min-width:76px}
.when b{display:block;font-size:18px;font-family:var(--f-display)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
/* deals */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:4px;background:var(--surface-2)}
.steps span.on{background:var(--gold)}
.steplab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
.tbl{overflow-x:auto}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.hist div{display:flex;gap:8px}
.hist time{color:var(--muted);font-family:var(--f-mono);font-size:12px;flex:none;width:58px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--gold)}
.bar em{font-style:normal;font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--muted)}
/* forms + modal */
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 32px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(4,33,26,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;text-align:center;font-size:13.5px;font-weight:600}
.slot[aria-pressed="true"]{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
nav.tabs{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;align-items:center;position:relative}
  nav.tabs button .n{position:absolute;top:2px;right:18%;margin:0}
  .chat{grid-template-columns:1fr}
  .chat.open .threads{display:none}
  .chat:not(.open) .conv{display:none}
  .back{display:inline-block}
  .form{grid-template-columns:1fr}
  .bar{grid-template-columns:96px 1fr 30px}
  .head h1{font-size:24px}
  .who span{display:none}
  .top{gap:8px 10px}
  .top img{height:28px}
  .top .name{font-size:16px}
  .demo{font-size:10px;padding:2px 7px}
}
.exbanner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.exbanner a{color:inherit;font-weight:700}
</style>
</head>

  {id:4,name:'Kikuyu Craft Collective',city:'Kiambu, Kenya',role:'Supplier',score:83,tags:['Handwoven textiles','Wood carving'],why:'Kenyan makers of handwoven textiles and carved wood. A local sourcing partner for your Africa line.'},
  {id:5,name:'East Africa Build Week',city:'Nairobi, Kenya',role:'Organiser',score:79,tags:['Expo','June 2027'],why:'Construction and interiors expo looking for interiors exhibitors from the UAE. Hosted buyer meetings on site.'},
  {id:6,name:'Mwangi & Ochieng Architects',city:'Nairobi, Kenya',role:'Buyer',score:86,tags:['Architects','Hospitality projects'],why:'Designing 2 boutique hotels. They specify furniture and need a procurement partner who keeps design intent.'},
  {id:7,name:'Anatolia Furniture Works',city:'Izmir, Turkey',role:'Manufacturer',score:68,tags:['Custom furniture','Factory'],why:'Custom hotel furniture factory. Could supply your Kenya projects at lower cost.'},
  {id:8,name:'Kampala Serviced Suites',city:'Kampala, Uganda',role:'Buyer',score:81,tags:['Serviced apartments','64 units'],why:'Fitting out 64 serviced apartments and comparing turnkey quotes this quarter.'}
 ],
 passed:new Set(), saved:new Set([1]),
 threads:[
  {co:1,msgs:[['them','Hello, we saw your profile through SAIS. Do you deliver to Nairobi?','09:12'],['me','Yes, door to site, with installation. Happy to share our hotel projects.','09:20'],['them','Great. Can you send a quote for 120 guest rooms?','09:31']],unread:1},
  {co:2,msgs:[['ai','Matchmaker agent introduced you to Lakeside Lodges. Both sides accepted.','Mon'],['them','Karibu. We are refurbishing three lodges near Arusha. Can we talk this week?','Mon']],unread:1},
  {co:4,msgs:[['me','We would like samples of your handwoven throws for a hotel project.','Fri'],['them','We can send 5 samples to Dubai by courier next week.','Fri']],unread:0}
 ],
 meetings:[
  {co:1,day:'Tue 27 Oct',time:'10:00',type:'Video call',status:'Confirmed'},
  {co:5,day:'Wed 9 Jun 2027',time:'14:00',type:'VIP lounge, East Africa Build Week',status:'Confirmed'}
 ],
 deals:[
  {id:'D-1042',co:1,title:'Guest room FF&E, 120 rooms',stage:1,items:[['King bed with headboard',120,780],['Wardrobe and luggage rack',120,640],['Desk, chair and lamp set',120,410],['Lobby lounge furniture',1,38500]],offers:[['Oct 20','You sent the first offer'],['Oct 22','Savannah Crest asked for 6% off on wardrobes'],['Oct 24','Follow up agent reminded Savannah Crest to reply']],discount:0},
  {id:'D-1039',co:2,title:'Lodge refurbishment, natural materials',stage:0,items:[['Teak lounge chairs',48,520],['Handwoven throws (Kikuyu Craft)',96,65],['Pendant lights, rattan',60,180]],offers:[['Oct 23','Draft created after your call']],discount:0}
 ],
 pending:[
  {name:'Mombasa Fresh Exports',city:'Mombasa, Kenya',role:'Exporter',site:'mombasafresh.example',note:'Fresh mangoes and avocados. Annual exports above USD 1 million.'},
  {name:'Rift Valley Coffee Co-op',city:'Nakuru, Kenya',role:'Exporter',site:'facebook.com/riftvalleycoffee',note:'Specialty green coffee. 1,200 farmer members.'},
  {name:'Kigali Agro Traders',city:'Kigali, Rwanda',role:'Importer',site:'none given',note:'Imports food processing machinery. No website or social link.'}
 ],
 agentRuns:128
};
const STEPS=['Proposed','Negotiating','Accepted','Delivered'];
const co=id=>S.cos.find(c=>c.id===id);
const ini=n=>n.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join('');
const av=c=>`<span class="av" style="background:${COLORS[c.id%COLORS.length]}">${ini(c.name)}</span>`;
const money=n=>'USD '+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const $=s=>document.querySelector(s);
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

function navItems(){
 const unread=S.threads.reduce((a,t)=>a+t.unread,0);
 const base=[['matches','Matches'],['messages','Messages',unread],['meetings','Meetings'],['deals','Deals'],['profile','My company']];
 return S.who==='admin'?[['admin','Overview',S.pending.length],['matches','Matches'],['messages','Messages',unread],['deals','Deals']]:base;
}
function renderNav(){
 const html=navItems().map(([k,l,n])=>`<button data-go="${k}" ${S.view===k?'aria-current="page"':''}>${ICON[k]}<span>${l}</span>${n?`<span class="n">${n}</span>`:''}</button>`).join('');
 $('#sideNav').innerHTML=html;$('#tabNav').innerHTML=html;
}
function go(v){S.view=v;render();window.scrollTo(0,0)}

function viewMatches(){
 const roles=['All','Buyer','Supplier','Manufacturer','Organiser'];
 const list=S.cos.filter(c=>!S.passed.has(c.id)&&(S.filter==='All'||c.role===S.filter)).sort((a,b)=>b.score-a.score);
 return `<div class="head"><div><span class="eyebrow">AI matchmaking</span><h1>Your best matches this week</h1><p>The matchmaker agent compares your products, markets and project size with every vetted company on the platform.</p></div></div>
 <div class="agent"><span class="dot pulse">${ICON.bot}</span><div><b>Matchmaker agent</b><p>Scanned ${S.agentRuns} vetted profiles today and found ${list.length} companies that fit ${esc(S.me.name)}. New matches arrive every morning.</p></div></div>
 <div class="chips" role="group" aria-label="Filter by type">${roles.map(r=>`<button class="chip" data-filter="${r}" aria-pressed="${S.filter===r}">${r}</button>`).join('')}</div>
 ${list.length?`<div class="grid">${list.map(c=>`<article class="card">
   <div class="co">${av(c)}<div><h3>${esc(c.name)}</h3><small>${esc(c.city)}</small></div><div class="score"><b>${c.score}%</b><span>match</span></div></div>
   <div class="tags"><span class="tag role">${c.role}</span>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<span class="tag ok">Vetted by SAIS</span></div>
   <div class="why"><span class="eyebrow">Why this match</span>${esc(c.why)}</div>
   <div class="row"><button class="btn pri" data-msg="${c.id}">Message</button><button class="btn gold" data-book="${c.id}">Book meeting</button><button class="btn ghost" data-pass="${c.id}">Not now</button></div>
 </article>`).join('')}</div>`:`<p class="empty">No matches in this group yet. The agent checks again tomorrow morning.</p>`}`;
}

function viewMessages(){
 if(!S.open&&window.innerWidth>820&&S.threads.length)S.open=S.threads[0].co;
 const t=S.threads.find(x=>x.co===S.open);
 const c=t&&co(t.co);
 return `<div class="head"><div><span class="eyebrow">Conversations</span><h1>Messages</h1></div></div>
 <div class="chat ${t?'open':''}">
  <div class="threads">${S.threads.map(x=>{const cc=co(x.co),last=x.msgs[x.msgs.length-1];return `<button class="thread" data-thread="${x.co}" aria-current="${x.co===S.open}">${av(cc)}<span class="t"><b>${esc(cc.name)}</b><span>${esc(last[1])}</span></span>${x.unread?'<span class="pill warn">New</span>':''}</button>`}).join('')}</div>
  <div class="conv">${t?`<div class="ch"><button class="btn ghost back" data-back>Back</button>${av(c)}<div><b>${esc(c.name)}</b><br><small style="color:var(--muted)">${esc(c.city)} · ${c.role}</small></div>
    <div class="row"><button class="btn gold" data-book="${c.id}">Book meeting</button>${c.role==='Buyer'?`<button class="btn" data-newdeal="${c.id}">Open deal room</button>`:''}</div></div>
   <div class="msgs" id="msgs">${t.msgs.map(([w,txt,tm])=>`<div class="m ${w}">${esc(txt)}${w!=='ai'?`<time>${tm}</time>`:''}</div>`).join('')}</div>
   <form class="compose" id="compose"><input id="msgIn" placeholder="Write a message" autocomplete="off" aria-label="Message"><button class="btn pri">Send</button></form>`:`<p class="empty">Choose a conversation.</p>`}</div>
 </div>`;
}

function viewMeetings(){
 return `<div class="head"><div><span class="eyebrow">Calendar</span><h1>Meetings</h1><p>Video calls and VIP meetings at trade fairs. Both sides get a reminder 1 day and 1 hour before.</p></div><button class="btn gold" data-book="2">Book a meeting</button></div>
 <div class="list">${S.meetings.map(m=>{const c=co(m.co);const [d,...rest]=m.day.split(' ');return `<div class="li"><div class="when">${d}<b>${rest[0]}</b>${rest.slice(1).join(' ')}</div><div class="t"><b>${esc(c.name)}</b><span>${m.time} · ${esc(m.type)}</span></div><span class="pill ${m.status==='Confirmed'?'good':'warn'}">${m.status}</span></div>`}).join('')}</div>`;
}

function dealTotal(d){const sub=d.items.reduce((a,[,q,p])=>a+q*p,0);return {sub,disc:sub*d.discount/100,total:sub*(1-d.discount/100)}}
function viewDeals(){
 return `<div class="head"><div><span class="eyebrow">Deal rooms</span><h1>Deals</h1><p>One page per deal: the offer, every change, and the final yes. Payments come in a later stage.</p></div></div>
 ${S.deals.map(d=>{const c=co(d.co),T=dealTotal(d);return `<article class="card">
  <div class="co">${av(c)}<div><h3>${esc(d.title)}</h3><small>${esc(c.name)} · ${d.id}</small></div><div class="score"><b style="font-size:16px;color:var(--fg)">${money(T.total)}</b><span>${STEPS[d.stage]}</span></div></div>
  <div><div class="steps">${STEPS.map((s,i)=>`<span class="${i<=d.stage?'on':''}"></span>`).join('')}</div><div class="steplab">${STEPS.map(s=>`<span>${s}</span>`).join('')}</div></div>
  <div class="tbl"><table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr></thead><tbody>
   ${d.items.map(([n,q,p])=>`<tr><td>${esc(n)}</td><td class="num">${q}</td><td class="num">${p.toLocaleString('en-US')}</td><td class="num">${(q*p).toLocaleString('en-US')}</td></tr>`).join('')}
   ${d.discount?`<tr><td colspan="3">Discount ${d.discount}%</td><td class="num">-${Math.round(T.disc).toLocaleString('en-US')}</td></tr>`:''}
   <tr><td colspan="3"><b>Total</b></td><td class="num"><b>${Math.round(T.total).toLocaleString('en-US')}</b></td></tr></tbody></table></div>
  <div class="hist">${d.offers.map(([t,x])=>`<div><time>${t}</time><span>${esc(x)}</span></div>`).join('')}</div>
  ${d.stage<2?`<div class="row"><button class="btn" data-counter="${d.id}">Offer a discount</button><button class="btn pri" data-accept="${d.id}">Mark as accepted</button></div>`:`<div class="row"><span class="pill good">Deal accepted. SAIS will follow up on delivery.</span></div>`}
 </article>`}).join('')}`;
}

function strength(){const f=['name','city','role','sells','wants','markets','size','site'];return Math.round(f.filter(k=>String(S.me[k]||'').trim().length>2).length/f.length*100)}
function viewProfile(){
 const m=S.me,sc=strength();
 return `<div class="head"><div><span class="eyebrow">Company profile</span><h1>My company</h1><p>The matchmaker agent reads this profile. The more precise it is, the better your matches.</p></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Profile strength</span><span id="pct">${sc}%</span></div><div class="meter"><i id="meter" style="width:${sc}%"></i></div><span class="tag ok" style="align-self:flex-start">Vetted by SAIS</span></div>
 <form class="card form" id="prof">
  <label class="f">Company name<input id="p_name" value="${esc(m.name)}"></label>
  <label class="f">City and country<input id="p_city" value="${esc(m.city)}"></label>
  <label class="f">I am a<select id="p_role">${['Buyer','Importer','Exporter','Supplier','Manufacturer','Organiser','Service provider'].map(r=>`<option ${r===m.role?'selected':''}>${r}</option>`).join('')}</select></label>
  <label class="f">Usual deal size<input id="p_size" value="${esc(m.size)}"></label>
  <label class="f full">What we sell or buy<textarea id="p_sells" rows="2">${esc(m.sells)}</textarea></label>
  <label class="f full">Who we want to meet<textarea id="p_wants" rows="2">${esc(m.wants)}</textarea></label>
  <label class="f">Target markets<input id="p_markets" value="${esc(m.markets)}"></label>
  <label class="f">Website or social page<input id="p_site" value="${esc(m.site)}"></label>
  <div class="full row"><button class="btn pri">Save and rematch</button></div>
 </form>`;
}

function viewAdmin(){
 const roles={};S.cos.forEach(c=>roles[c.role]=(roles[c.role]||0)+1);
 const counts=[['Buyers',412],['Suppliers',268],['Manufacturers',157],['Exporters',139],['Importers',121],['Organisers',24]];
 const max=Math.max(...counts.map(x=>x[1]));
 const value=S.deals.reduce((a,d)=>a+dealTotal(d).total,0);
 return `<div class="head"><div><span class="eyebrow">SAIS admin</span><h1>Platform overview</h1><p>Sample figures for the demo. You approve every company before the agent can match it.</p></div></div>
 <div class="stats"><div class="stat"><b>1,121</b><span>Vetted companies</span></div><div class="stat"><b>${S.agentRuns*11}</b><span>AI matches this month</span></div><div class="stat"><b>${86+S.meetings.length}</b><span>Meetings booked</span></div><div class="stat"><b>${money(value*9).replace('USD ','$')}</b><span>Value in open deal rooms</span></div></div>
 <div class="card"><h3 style="font-family:var(--f-body);font-size:16px">Members by type</h3><div class="bars">${counts.map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/max*100}%"></i><em>${v}</em></div>`).join('')}</div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="font-family:var(--f-body);font-size:16px">Waiting for vetting</h3><span class="pill warn">${S.pending.length} pending</span></div>
  <div class="agent" style="background:var(--surface-2);color:var(--fg)"><span class="dot">${ICON.bot}</span><div><b style="color:var(--gold-ink)">Vetting agent</b><p style="color:var(--muted)">Checks each website or social link and flags companies with missing details. You make the final call.</p></div></div>
  ${S.pending.length?`<div class="list">${S.pending.map((p,i)=>{const flag=/none/i.test(p.site);return `<div class="li"><div class="t"><b>${esc(p.name)}</b><span>${esc(p.city)} · ${p.role} · ${esc(p.site)}</span><br><span>${esc(p.note)}</span></div>${flag?'<span class="pill bad">Flag: no link</span>':'<span class="pill good">Link checked</span>'}<div class="row"><button class="btn pri" data-approve="${i}">Approve</button><button class="btn ghost" data-decline="${i}">Decline</button></div></div>`}).join('')}</div>`:'<p class="empty">All companies are vetted.</p>'}
 </div>`;
}

function render(){
 renderNav();
 const v={matches:viewMatches,messages:viewMessages,meetings:viewMeetings,deals:viewDeals,profile:viewProfile,admin:viewAdmin}[S.view]||viewMatches;
 $('#view').innerHTML=v();
 const ms=$('#msgs');if(ms)ms.scrollTop=ms.scrollHeight;
}

function ensureThread(id){let t=S.threads.find(x=>x.co===id);if(!t){t={co:id,msgs:[['ai','Matchmaker agent introduced you to '+co(id).name+'. Say hello.','now']],unread:0};S.threads.unshift(t)}return t}

const REPLIES=['Thanks, that helps. Can you share photos of a past hotel project?','Good. What is your delivery time to Nairobi?','Noted. Let us meet this week to go through the details.'];
function openBook(id){
 const c=co(id);const days=['Tue 27 Oct','Wed 28 Oct','Thu 29 Oct','Mon 2 Nov','Tue 3 Nov'];const times=['09:00','11:00','14:00','16:00'];
 let sel={day:days[0],time:null};
 $('#dlgBody').innerHTML=`<div class="co">${av(c)}<div><h3 style="font-family:var(--f-body)">Book a meeting</h3><small style="color:var(--muted)">with ${esc(c.name)}</small></div></div>
  <label class="f">Meeting type<select id="mType"><option>Video call</option><option>VIP lounge, Food Africa Cairo (7 to 10 Dec)</option><option>VIP lounge, East Africa Build Week</option><option>In person, Nairobi</option></select></label>
  <div><span class="eyebrow">Day</span><div class="slots" id="dSlots">${days.map((d,i)=>`<button class="slot" data-d="${d}" aria-pressed="${i===0}">${d}</button>`).join('')}</div></div>
  <div><span class="eyebrow">Time, Nairobi</span><div class="slots" id="tSlots">${times.map(t=>`<button class="slot" data-t="${t}" aria-pressed="false">${t}</button>`).join('')}</div></div>
  <p style="margin:0;font-size:13px;color:var(--muted)">Times both calendars have free. The other side confirms in one tap.</p>
  <div class="row"><button class="btn pri" id="mOk" disabled>Send invite</button><button class="btn ghost" id="mCancel">Cancel</button></div>`;
 const d=$('#dlg');d.showModal();
 d.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel.day=b.dataset.d;d.querySelectorAll('[data-d]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 d.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{sel.time=b.dataset.t;d.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#mOk').disabled=false});
 $('#mCancel').onclick=()=>d.close();
 $('#mOk').onclick=()=>{S.meetings.unshift({co:id,day:sel.day,time:sel.time,type:$('#mType').value,status:'Waiting for reply'});d.close();toast('Invite sent to '+c.name);
  setTimeout(()=>{const m=S.meetings.find(x=>x.co===id&&x.status!=='Confirmed');if(m){m.status='Confirmed';toast(c.name+' confirmed the meeting');if(S.view==='meetings')render()}},3500);
  go('meetings')};
}
function openCounter(id){
 const dl=S.deals.find(x=>x.id===id);
 $('#dlgBody').innerHTML=`<h3>Offer a discount</h3><p style="margin:0;color:var(--muted)">${esc(dl.title)}</p>
  <label class="f">Discount on the whole order (%)<input id="disc" type="number" min="0" max="30" value="${dl.discount||5}"></label>
  <div class="row"><button class="btn pri" id="dOk">Send new offer</button><button class="btn ghost" id="dCancel">Cancel</button></div>`;
 const d=$('#dlg');d.showModal();$('#dCancel').onclick=()=>d.close();
 $('#dOk').onclick=()=>{const v=Math.max(0,Math.min(30,+$('#disc').value||0));dl.discount=v;dl.stage=Math.max(dl.stage,1);dl.offers.push(['Today','You offered '+v+'% off. New total '+money(dealTotal(dl).total)]);d.close();toast('New offer sent');render()};
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const ds=b.dataset;
 if(ds.go){S.open=null;go(ds.go)}
 else if(ds.filter){S.filter=ds.filter;render()}
 else if(ds.pass){S.passed.add(+ds.pass);toast('Hidden. The agent will learn from this.');render()}
 else if(ds.msg){const id=+ds.msg;ensureThread(id);S.open=id;go('messages')}
 else if(ds.thread){S.open=+ds.thread;const t=S.threads.find(x=>x.co===S.open);t.unread=0;render()}
 else if('back' in ds){S.open=null;render()}
 else if(ds.book){openBook(+ds.book)}
 else if(ds.counter){openCounter(ds.counter)}
 else if(ds.accept){const d=S.deals.find(x=>x.id===ds.accept);d.stage=2;d.offers.push(['Today','Both sides accepted the offer']);toast('Deal accepted');render()}
 else if(ds.newdeal){const id=+ds.newdeal;if(!S.deals.find(x=>x.co===id)){S.deals.unshift({id:'D-'+(1043+S.deals.length),co:id,title:'New deal with '+co(id).name,stage:0,items:[['Item to be agreed',1,0]],offers:[['Today','Deal room opened from chat']],discount:0})}go('deals')}
 else if(ds.approve!==undefined){const p=S.pending.splice(+ds.approve,1)[0];toast(p.name+' approved. The agent will match it tonight.');render()}
 else if(ds.decline!==undefined){const p=S.pending.splice(+ds.decline,1)[0];toast(p.name+' declined. We will email them why.');render()}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='compose'){const i=$('#msgIn'),v=i.value.trim();if(!v)return;const t=S.threads.find(x=>x.co===S.open);t.msgs.push(['me',v,'now']);render();
  setTimeout(()=>{t.msgs.push(['them',REPLIES[t.msgs.length%REPLIES.length],'now']);if(t.msgs.length%2===0)t.msgs.push(['ai','Tip from the agent: you have exchanged a few messages. Book a meeting to move faster.','']);if(S.view==='messages'&&S.open===t.co)render();else{t.unread++;renderNav()}},1600)}
 if(e.target.id==='prof'){['name','city','role','size','sells','wants','markets','site'].forEach(k=>S.me[k]=$('#p_'+k).value);S.agentRuns+=7;toast('Saved. The agent found new matches for you.');go('matches')}
});
document.addEventListener('input',e=>{if(e.target.closest('#prof')){const f=['name','city','size','sells','wants','markets','site'];const filled=f.filter(k=>$('#p_'+k).value.trim().length>2).length+1;const sc=Math.round(filled/8*100);$('#pct').textContent=sc+'%';$('#meter').style.width=sc+'%'}});
$('#whoSel').onchange=e=>{S.who=e.target.value;S.open=null;go(S.who==='admin'?'admin':'matches')};
const h=(location.hash||'').slice(1);if(['matches','messages','meetings','deals','profile'].includes(h))S.view=h;if(h==='admin'){S.who='admin';$('#whoSel').value='admin';S.view='admin'}
render();
})();
</script>

</body>
</html>
